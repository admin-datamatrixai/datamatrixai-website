<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accolades — DatamatrixAI</title>
    <link rel="stylesheet" href="css/styles.css?v=2.0.1">
    <link rel="stylesheet" href="css/nav-dropdown.css?v=2.0.1">
    <link rel="icon" type="image/png" href="assets/images/logo.png?v=2.0.1">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --blue:   #0057B8;
            --orange: #FF8C00;
            --green:  #00A651;
            --bg:     #05070a;
            --bg2:    #080e18;
            --bg3:    #030b16;
            --border: rgba(0,87,184,0.18);
            --white:  #ffffff;
            --dim:    rgba(255,255,255,0.60);
            --dimmer: rgba(255,255,255,0.32);
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--white); overflow-x: hidden; }
        a { text-decoration: none; color: inherit; }

        /* HEADER */
        .hdr {
            position: fixed; top: 0; left: 0; width: 100%; height: 72px;
            z-index: 1000; display: flex; align-items: center;
            justify-content: space-between; padding: 0 5%;
            background: rgba(5,7,10,0.85); backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
        }
        .hdr__back { display: inline-flex; align-items: center; gap: 8px; font-size: 0.85rem; font-weight: 500; color: var(--dim); transition: color 0.2s; }
        .hdr__back:hover { color: var(--orange); }
        .hdr__logo { display: flex; align-items: center; gap: 10px; }
        .hdr__logo img { height: 32px; }
        .hdr__logo span { font-family: 'Syne', sans-serif; font-size: 0.95rem; font-weight: 700; }
        .hdr__logo span em { font-style: normal; color: var(--orange); }
        .hdr__cta { display: inline-flex; align-items: center; gap: 8px; padding: 8px 20px; border-radius: 6px; background: var(--blue); color: var(--white); font-size: 0.82rem; font-weight: 500; border: 2px solid var(--blue); transition: all 0.3s; }
        .hdr__cta:hover { background: transparent; border-color: var(--orange); color: var(--orange); }

        /* HERO */
        .pg-hero {
            padding: 148px 5% 72px; text-align: center; position: relative;
            overflow: hidden;
            background: radial-gradient(ellipse 70% 50% at 50% 0%, rgba(0,87,184,0.08) 0%, transparent 65%), var(--bg);
        }
        .pg-hero::before {
            content: ''; position: absolute; inset: 0;
            background-image: linear-gradient(rgba(0,87,184,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0,87,184,0.03) 1px, transparent 1px);
            background-size: 52px 52px; pointer-events: none;
        }
        .eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: 0.68rem; font-weight: 500; letter-spacing: 0.15em; text-transform: uppercase; color: var(--orange); border: 1px solid rgba(255,140,0,0.26); background: rgba(255,140,0,0.05); padding: 5px 14px; border-radius: 100px; margin-bottom: 24px; position: relative; }
        .pg-hero__title { font-family: 'Syne', sans-serif; font-size: clamp(2rem, 4vw, 3rem); font-weight: 800; letter-spacing: -0.03em; line-height: 1.08; color: var(--white); margin-bottom: 16px; position: relative; }
        .pg-hero__title em { font-style: normal; color: var(--orange); }
        .pg-hero__sub { font-size: clamp(0.9rem, 1.6vw, 1.05rem); font-weight: 300; color: var(--dim); max-width: 480px; margin: 0 auto; line-height: 1.75; position: relative; }

        /* DIVIDER */
        .divider { width: 100%; height: 1px; background: linear-gradient(to right, transparent, var(--border), transparent); }

        /* SECTION */
        .section { padding: 80px 5%; }
        .section--alt { background: var(--bg2); }
        .section--dark { background: var(--bg3); }
        .section__inner { max-width: 1060px; margin: 0 auto; }
        .sec-label { font-size: 0.68rem; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: var(--orange); display: block; margin-bottom: 10px; }
        .sec-heading { font-family: 'Syne', sans-serif; font-size: clamp(1.4rem, 2.8vw, 2rem); font-weight: 800; letter-spacing: -0.025em; line-height: 1.15; color: var(--white); margin-bottom: 32px; }
        .sec-heading em { font-style: normal; color: var(--orange); }

        /* AWARDS GRID */
        .awards-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .award-card {
            background: rgba(0,20,55,0.4);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 36px 28px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
            overflow: hidden;
            transition: border-color 0.3s, transform 0.3s;
        }

        .award-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(to right, var(--orange), transparent);
        }

        .award-card:hover {
            border-color: rgba(255,140,0,0.3);
            transform: translateY(-4px);
        }

        .award-card__icon {
            width: 48px; height: 48px;
            border-radius: 12px;
            background: rgba(255,140,0,0.08);
            border: 1px solid rgba(255,140,0,0.22);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem; color: var(--orange);
        }

        /* title and body empty — content to be added */
        .award-card__year {
            font-size: 0.68rem;
            font-weight: 500;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--dimmer);
        }

        .award-card__title {
            font-family: 'Syne', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            color: var(--white);
            letter-spacing: -0.01em;
            /* empty */
        }

        .award-card__body {
            font-size: 0.85rem;
            font-weight: 300;
            color: var(--dim);
            line-height: 1.6;
            /* empty */
        }

        .award-card__issuer {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            font-weight: 400;
            color: var(--dimmer);
            margin-top: auto;
        }

        .award-card__issuer i { font-size: 0.7rem; color: var(--orange); }

        /* PRESS / MENTIONS ROW */
        .mentions-row {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-top: 8px;
        }

        .mention-pill {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 22px;
            background: rgba(0,20,55,0.4);
            border: 1px solid var(--border);
            border-radius: 14px;
            flex: 1;
            min-width: 200px;
            transition: border-color 0.3s, transform 0.3s;
        }

        .mention-pill:hover {
            border-color: rgba(255,140,0,0.28);
            transform: translateY(-2px);
        }

        .mention-pill__icon {
            width: 36px; height: 36px; flex-shrink: 0;
            border-radius: 8px;
            background: rgba(0,87,184,0.1);
            border: 1px solid rgba(0,87,184,0.22);
            display: flex; align-items: center; justify-content: center;
            font-size: 0.9rem; color: var(--orange);
        }

        .mention-pill__label {
            font-family: 'DM Sans', sans-serif;
            font-size: 0.85rem;
            font-weight: 400;
            color: var(--dim);
            /* empty */
        }

        /* SCROLL REVEAL */
        .sr { opacity: 0; transform: translateY(22px); transition: opacity 0.7s cubic-bezier(0.22,1,0.36,1), transform 0.7s cubic-bezier(0.22,1,0.36,1); }
        .sr.sr--visible { opacity: 1; transform: translateY(0); }
        .sr--d1 { transition-delay: 0.1s; }
        .sr--d2 { transition-delay: 0.2s; }
        .sr--d3 { transition-delay: 0.3s; }
        .sr--d4 { transition-delay: 0.4s; }
        .sr--d5 { transition-delay: 0.5s; }

        @media (max-width: 860px) { .awards-grid { grid-template-columns: 1fr 1fr; } }
        @media (max-width: 540px) { .awards-grid { grid-template-columns: 1fr; } .section { padding: 60px 5%; } }
    </style>
</head>
<body>

<header class="hdr">
    <a href="index.html" class="hdr__back"><i class="fas fa-arrow-left"></i> Back to Home</a>
    <div class="hdr__logo">
        <img src="assets/images/logo.png" alt="DatamatrixAI">
        <span>Datamatrix<em>.AI</em></span>
    </div>
    <a href="index.html#contact" class="hdr__cta">Contact Us <i class="fas fa-arrow-right"></i></a>
</header>

<section class="pg-hero">
    <div class="eyebrow sr"><i class="fas fa-trophy"></i> Recognition</div>
    <h1 class="pg-hero__title sr sr--d1"><em>Accolades.</em></h1>
    <p class="pg-hero__sub sr sr--d2"></p>
</section>

<div class="divider"></div>

<!-- AWARDS -->
<section class="section">
    <div class="section__inner">
        <span class="sec-label sr">Awards &amp; Recognition</span>
        <h2 class="sec-heading sr sr--d1">What we've been <em>recognised for.</em></h2>

        <div class="awards-grid">
            <div class="award-card sr sr--d1">
                <div class="award-card__icon"><i class="fas fa-award"></i></div>
                <div class="award-card__year"></div>
                <div class="award-card__title"></div>
                <div class="award-card__body"></div>
                <div class="award-card__issuer"><i class="fas fa-building"></i></div>
            </div>
            <div class="award-card sr sr--d2">
                <div class="award-card__icon"><i class="fas fa-award"></i></div>
                <div class="award-card__year"></div>
                <div class="award-card__title"></div>
                <div class="award-card__body"></div>
                <div class="award-card__issuer"><i class="fas fa-building"></i></div>
            </div>
            <div class="award-card sr sr--d3">
                <div class="award-card__icon"><i class="fas fa-award"></i></div>
                <div class="award-card__year"></div>
                <div class="award-card__title"></div>
                <div class="award-card__body"></div>
                <div class="award-card__issuer"><i class="fas fa-building"></i></div>
            </div>
            <div class="award-card sr sr--d1">
                <div class="award-card__icon"><i class="fas fa-award"></i></div>
                <div class="award-card__year"></div>
                <div class="award-card__title"></div>
                <div class="award-card__body"></div>
                <div class="award-card__issuer"><i class="fas fa-building"></i></div>
            </div>
            <div class="award-card sr sr--d2">
                <div class="award-card__icon"><i class="fas fa-award"></i></div>
                <div class="award-card__year"></div>
                <div class="award-card__title"></div>
                <div class="award-card__body"></div>
                <div class="award-card__issuer"><i class="fas fa-building"></i></div>
            </div>
            <div class="award-card sr sr--d3">
                <div class="award-card__icon"><i class="fas fa-award"></i></div>
                <div class="award-card__year"></div>
                <div class="award-card__title"></div>
                <div class="award-card__body"></div>
                <div class="award-card__issuer"><i class="fas fa-building"></i></div>
            </div>
        </div>
    </div>
</section>

<div class="divider"></div>

<!-- PRESS MENTIONS -->
<section class="section section--alt">
    <div class="section__inner">
        <span class="sec-label sr">Press &amp; Media</span>
        <h2 class="sec-heading sr sr--d1">In the <em>news.</em></h2>
        <div class="mentions-row">
            <div class="mention-pill sr sr--d1">
                <div class="mention-pill__icon"><i class="fas fa-newspaper"></i></div>
                <div class="mention-pill__label"></div>
            </div>
            <div class="mention-pill sr sr--d2">
                <div class="mention-pill__icon"><i class="fas fa-newspaper"></i></div>
                <div class="mention-pill__label"></div>
            </div>
            <div class="mention-pill sr sr--d3">
                <div class="mention-pill__icon"><i class="fas fa-newspaper"></i></div>
                <div class="mention-pill__label"></div>
            </div>
            <div class="mention-pill sr sr--d4">
                <div class="mention-pill__icon"><i class="fas fa-newspaper"></i></div>
                <div class="mention-pill__label"></div>
            </div>
        </div>
    </div>
</section>

<script>
(function(){
    const els = document.querySelectorAll('.sr');
    const obs = new IntersectionObserver(entries => {
        entries.forEach(e => { if(e.isIntersecting){ e.target.classList.add('sr--visible'); obs.unobserve(e.target); } });
    }, { threshold: 0.12 });
    els.forEach(el => obs.observe(el));
})();
</script>
<script src="js/nav-inject.js?v=2.0.1"></script>
<script src="js/nav.js?v=2.0.1"></script>
</body>
</html>
