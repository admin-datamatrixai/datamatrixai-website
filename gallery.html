<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery &amp; Events — DatamatrixAI</title>
    <link rel="stylesheet" href="css/styles.css?v=2.0.1">
    <link rel="stylesheet" href="css/nav-dropdown.css?v=2.0.1">
    <link rel="icon" type="image/png" href="assets/images/logo.png?v=2.0.1">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --blue:   #0057B8;
            --orange: #FF8C00;
            --green:  #00A651;
            --bg:     #05070a;
            --bg2:    #080e18;
            --bg3:    #030b16;
            --border: rgba(0,87,184,0.18);
            --white:  #ffffff;
            --dim:    rgba(255,255,255,0.60);
            --dimmer: rgba(255,255,255,0.32);
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--white); overflow-x: hidden; }
        a { text-decoration: none; color: inherit; }

        /* HEADER */
        .hdr { position: fixed; top: 0; left: 0; width: 100%; height: 72px; z-index: 1000; display: flex; align-items: center; justify-content: space-between; padding: 0 5%; background: rgba(5,7,10,0.85); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border); }
        .hdr__back { display: inline-flex; align-items: center; gap: 8px; font-size: 0.85rem; font-weight: 500; color: var(--dim); transition: color 0.2s; }
        .hdr__back:hover { color: var(--orange); }
        .hdr__logo { display: flex; align-items: center; gap: 10px; }
        .hdr__logo img { height: 32px; }
        .hdr__logo span { font-family: 'Syne', sans-serif; font-size: 0.95rem; font-weight: 700; }
        .hdr__logo span em { font-style: normal; color: var(--orange); }
        .hdr__cta { display: inline-flex; align-items: center; gap: 8px; padding: 8px 20px; border-radius: 6px; background: var(--blue); color: var(--white); font-size: 0.82rem; font-weight: 500; border: 2px solid var(--blue); transition: all 0.3s; }
        .hdr__cta:hover { background: transparent; border-color: var(--orange); color: var(--orange); }

        /* HERO */
        .pg-hero { padding: 148px 5% 72px; text-align: center; position: relative; overflow: hidden; background: radial-gradient(ellipse 70% 50% at 50% 0%, rgba(0,87,184,0.08) 0%, transparent 65%), var(--bg); }
        .pg-hero::before { content: ''; position: absolute; inset: 0; background-image: linear-gradient(rgba(0,87,184,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0,87,184,0.03) 1px, transparent 1px); background-size: 52px 52px; pointer-events: none; }
        .eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: 0.68rem; font-weight: 500; letter-spacing: 0.15em; text-transform: uppercase; color: var(--orange); border: 1px solid rgba(255,140,0,0.26); background: rgba(255,140,0,0.05); padding: 5px 14px; border-radius: 100px; margin-bottom: 24px; position: relative; }
        .pg-hero__title { font-family: 'Syne', sans-serif; font-size: clamp(2rem, 4vw, 3rem); font-weight: 800; letter-spacing: -0.03em; line-height: 1.08; color: var(--white); margin-bottom: 16px; position: relative; }
        .pg-hero__title em { font-style: normal; color: var(--orange); }
        .pg-hero__sub { font-size: clamp(0.9rem, 1.6vw, 1.05rem); font-weight: 300; color: var(--dim); max-width: 480px; margin: 0 auto; line-height: 1.75; position: relative; }

        /* DIVIDER */
        .divider { width: 100%; height: 1px; background: linear-gradient(to right, transparent, var(--border), transparent); }

        /* SECTION */
        .section { padding: 80px 5%; }
        .section--alt { background: var(--bg2); }
        .section--dark { background: var(--bg3); }
        .section__inner { max-width: 1060px; margin: 0 auto; }
        .sec-label { font-size: 0.68rem; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: var(--orange); display: block; margin-bottom: 10px; }
        .sec-heading { font-family: 'Syne', sans-serif; font-size: clamp(1.4rem, 2.8vw, 2rem); font-weight: 800; letter-spacing: -0.025em; line-height: 1.15; color: var(--white); margin-bottom: 32px; }
        .sec-heading em { font-style: normal; color: var(--orange); }

        /* ── EVENTS LIST ── */
        .events-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .event-card {
            display: grid;
            grid-template-columns: 100px 1fr auto;
            gap: 28px;
            align-items: center;
            background: rgba(0,20,55,0.4);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 28px 32px;
            transition: border-color 0.3s, transform 0.3s;
            position: relative;
            overflow: hidden;
        }

        .event-card::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 2px;
            background: linear-gradient(to bottom, var(--blue), var(--orange));
            opacity: 0;
            transition: opacity 0.3s;
        }

        .event-card:hover {
            border-color: rgba(255,140,0,0.28);
            transform: translateX(4px);
        }

        .event-card:hover::before { opacity: 1; }

        .event-card__date {
            text-align: center;
        }

        .event-card__date-day {
            font-family: 'Syne', sans-serif;
            font-size: 2rem;
            font-weight: 800;
            color: var(--orange);
            line-height: 1;
            letter-spacing: -0.03em;
        }

        .event-card__date-month {
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--dimmer);
            margin-top: 4px;
        }

        .event-card__date-year {
            font-size: 0.7rem;
            font-weight: 300;
            color: var(--dimmer);
        }

        .event-card__divider {
            width: 1px;
            height: 48px;
            background: linear-gradient(to bottom, transparent, var(--border), transparent);
            flex-shrink: 0;
        }

        .event-card__title {
            font-family: 'Syne', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            color: var(--white);
            margin-bottom: 6px;
            letter-spacing: -0.01em;
        }

        .event-card__meta {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .event-card__meta span {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 0.78rem;
            font-weight: 300;
            color: var(--dimmer);
        }

        .event-card__meta i { font-size: 0.7rem; color: var(--orange); }

        .event-card__badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 0.65rem;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 5px 12px;
            border-radius: 100px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .event-card__badge--upcoming {
            color: var(--green);
            border: 1px solid rgba(0,166,81,0.28);
            background: rgba(0,166,81,0.06);
        }

        .event-card__badge--past {
            color: var(--dimmer);
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.03);
        }

        /* ── PHOTO GALLERY GRID ── */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-auto-rows: 220px;
            gap: 14px;
        }

        /* first item spans 2 cols */
        .gallery-grid .gallery-item:first-child {
            grid-column: span 2;
        }

        /* fourth item spans 2 rows */
        .gallery-grid .gallery-item:nth-child(4) {
            grid-row: span 2;
        }

        .gallery-item {
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border);
            background: rgba(0,20,55,0.4);
            position: relative;
            transition: border-color 0.3s, transform 0.3s;
            cursor: pointer;
        }

        .gallery-item:hover {
            border-color: rgba(255,140,0,0.3);
            transform: scale(1.01);
        }

        /* image goes here — empty slot */
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }

        .gallery-item:hover img { transform: scale(1.04); }

        /* overlay on hover */
        .gallery-item__overlay {
            position: absolute;
            inset: 0;
            background: rgba(5,7,10,0.55);
            display: flex;
            align-items: flex-end;
            padding: 16px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .gallery-item:hover .gallery-item__overlay { opacity: 1; }

        .gallery-item__caption {
            font-size: 0.78rem;
            font-weight: 400;
            color: rgba(255,255,255,0.85);
            /* empty — add text when photos are added */
        }

        /* empty state shown when no images yet */
        .gallery-item--empty {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 10px;
        }

        .gallery-item--empty i {
            font-size: 1.8rem;
            color: rgba(0,87,184,0.3);
        }

        .gallery-item--empty span {
            font-size: 0.75rem;
            color: var(--dimmer);
        }

        /* SCROLL REVEAL */
        .sr { opacity: 0; transform: translateY(22px); transition: opacity 0.7s cubic-bezier(0.22,1,0.36,1), transform 0.7s cubic-bezier(0.22,1,0.36,1); }
        .sr.sr--visible { opacity: 1; transform: translateY(0); }
        .sr--d1 { transition-delay: 0.1s; }
        .sr--d2 { transition-delay: 0.2s; }
        .sr--d3 { transition-delay: 0.3s; }
        .sr--d4 { transition-delay: 0.4s; }
        .sr--d5 { transition-delay: 0.5s; }

        @media (max-width: 860px) {
            .event-card { grid-template-columns: 80px 1fr; }
            .event-card__badge { display: none; }
            .gallery-grid { grid-template-columns: 1fr 1fr; }
            .gallery-grid .gallery-item:first-child { grid-column: span 2; }
            .gallery-grid .gallery-item:nth-child(4) { grid-row: span 1; }
        }
        @media (max-width: 540px) {
            .event-card { grid-template-columns: 1fr; gap: 12px; }
            .event-card__date { display: flex; align-items: center; gap: 8px; }
            .gallery-grid { grid-template-columns: 1fr; grid-auto-rows: 180px; }
            .gallery-grid .gallery-item:first-child { grid-column: span 1; }
            .section { padding: 60px 5%; }
        }
    </style>
</head>
<body>

<header class="hdr">
    <a href="index.html" class="hdr__back"><i class="fas fa-arrow-left"></i> Back to Home</a>
    <div class="hdr__logo">

            <div class="event-card sr sr--d2">

                    <div class="event-card__date-day"></div>
                    <div class="event-card__date-month"></div>
                    <div class="event-card__date-year"></div>
                </div>
                <div>
                    <div class="event-card__title"></div>
                    <div class="event-card__meta">
                        <span><i class="fas fa-location-dot"></i></span>
                        <span><i class="fas fa-tag"></i></span>
                    </div>
                </div>

            </div>

            <div class="event-card sr sr--d3">
                <div class="event-card__date">
                    <div class="event-card__date-day"></div>
                    <div class="event-card__date-month"></div>
                    <div class="event-card__date-year"></div>
                </div>
                <div>
                    <div class="event-card__title"></div>
                    <div class="event-card__meta">
                        <span><i class="fas fa-location-dot"></i></span>

                    </div>
                </div>
                <div class="event-card__badge event-card__badge--past"><i class="fas fa-circle"></i></div>

            <div class="event-card sr sr--d4">
                <div class="event-card__date">

    <div class="section__inner">

        <h2 class="sec-heading sr sr--d1">Moments from the <em>field.</em></h2>

        <div class="gallery-grid sr sr--d1">

            <div class="gallery-item gallery-item--empty">

            </div>
        </div>
    </div>
</section>

<script>
(function(){
    const els = document.querySelectorAll('.sr');
    const obs = new IntersectionObserver(entries => {
        entries.forEach(e => { if(e.isIntersecting){ e.target.classList.add('sr--visible'); obs.unobserve(e.target); } });
    }, { threshold: 0.12 });
    els.forEach(el => obs.observe(el));
})();
</script>
<script src="js/nav-inject.js?v=2.0.1"></script>

</body>
